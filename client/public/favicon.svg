<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#0a0e17" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="55%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <linearGradient id="textGrad" x1="12" y1="16" x2="52" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#bae6fd" />
    </linearGradient>
  </defs>

  <!-- Rounded dark badge -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2.5" />

  <!-- Subtle inner accent glow -->
  <rect x="6" y="6" width="52" height="52" rx="12" fill="none" stroke="#38bdf8" stroke-opacity="0.14" stroke-width="1" />

  <!-- Bold FS Monogram -->
  <text
    x="31"
    y="42"
    text-anchor="middle"
    font-family="'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif"
    font-weight="800"
    font-size="27"
    letter-spacing="-1.5"
    fill="url(#textGrad)"
  >FS</text>

  <!-- Active online emerald dot -->
  <circle cx="50" cy="14" r="4.5" fill="#34d399" stroke="#0a0e17" stroke-width="2" />
</svg>
